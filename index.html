<!DOCTYPE html>
<html>
<head>
  <title>Prime Harmonic Fractal Sequencer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0a; 
      color: #fff; 
      font-family: 'Courier New', monospace; 
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    canvas { border: 2px solid #333; cursor: pointer; }
    #fractalBg { 
      position: absolute; 
      opacity: 0.3; 
      pointer-events: none;
      filter: blur(1px);
    }
    #controls { 
      display: flex; 
      gap: 15px; 
      align-items: center;
      flex-wrap: wrap;
      background: #111;
      padding: 15px;
      border-radius: 8px;
    }
    button {
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-width: 120px;
      transition: all 0.2s;
    }
    button:hover { background: #333; box-shadow: 0 0 10px #0f0; }
    button.active { background: #0a0; color: #000; }
    button.playing { 
      background: #00f; 
      color: #fff;
      animation: pulse 0.5s infinite; 
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 5px #00f; }
      50% { box-shadow: 0 0 20px #00f; }
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input[type="range"] {
      width: 150px;
    }
    label {
      font-size: 11px;
      color: #0f0;
      text-transform: uppercase;
    }
    h2 {
      color: #0f0;
      text-shadow: 0 0 10px #0f0;
      letter-spacing: 2px;
    }
    .info {
      color: #666;
      font-size: 11px;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }
    .credit {
      color: #555;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .mode-info {
      background: #111;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #0f0;
      border: 1px solid #0f0;
    }
    .canvas-container {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h2>PRIME HARMONIC FRACTAL SEQUENCER</h2>
  
  <div id="controls">
    <button id="playBtn">PLAY</button>
    <button id="clearBtn">CLEAR</button>
    <button id="randomBtn">RANDOM</button>
    <button id="euclidBtn">EUCLIDEAN</button>
    <button id="fractalBtn">FRACTAL</button>
    
    <div class="slider-group">
      <label>BPM: <span id="bpmValue">120</span></label>
      <input type="range" id="bpmSlider" min="60" max="240" value="120">
    </div>
    
    <div class="slider-group">
      <label>Prime: <span id="primeValue">3</span></label>
      <input type="range" id="primeSlider" min="0" max="7" value="1" step="1">
    </div>
    
    <div class="slider-group">
      <label>Fractal Depth: <span id="depthValue">5</span></label>
      <input type="range" id="depthSlider" min="3" max="8" value="5" step="1">
    </div>
  </div>
  
  <div class="mode-info" id="modeInfo">
    HARMONIC MODE: Perfect Fifth (3:2 ratio)
  </div>
  
  <div class="canvas-container">
    <canvas id="fractalBg" width="480" height="480"></canvas>
    <canvas id="grid" width="480" height="480"></canvas>
  </div>
  
  <div class="info">
    Click to toggle notes • Colors = prime harmonics • Rows = overtone series • Columns = time steps<br>
    Euclidean mode generates fractal rhythms • Background = Sierpinski triangle from current prime<br>
    <span class="credit">christian.schladetsch@gmail.com</span>
  </div>
  
  <script type="module">
    // Prime numbers for harmonic ratios
    const PRIMES = [2, 3, 5, 7, 11, 13, 17, 19];
    const PRIME_NAMES = [
      'Octave (2:1)',
      'Perfect Fifth (3:2)', 
      'Major Third (5:4)',
      'Harmonic Seventh (7:4)',
      'Eleventh (11:8)',
      'Tridecimal (13:8)',
      'Seventeenth (17:16)',
      'Nineteenth (19:16)'
    ];
    
    // State
    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    const fractalCanvas = document.getElementById('fractalBg');
    const fractalCtx = fractalCanvas.getContext('2d');
    
    let currentPrime = 3;
    let fractalDepth = 5;
    let buttons = initButtons();
    let audioCtx = null;
    let fractalSeed = Math.random();
    
    // Initialize audio immediately
    window.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log('Audio context created');
      }
    }, { once: true });
    
    function initButtons() {
      const btns = Array(64).fill().map((_, i) => {
        const row = Math.floor(i / 8);
        const col = i % 8;
        return {
          active: false,
          color: getPrimeColor(row),
          note: getHarmonicNote(row, currentPrime),
          row, col
        };
      });
      
      // Set default pattern (simple beat)
      btns[0].active = true;   // Kick
      btns[16].active = true;  // Snare
      btns[32].active = true;  // Hi-hat
      btns[40].active = true;  // Hi-hat
      
      return btns;
    }
    
    // Color based on prime factorization
    function getPrimeColor(row) {
      const hue = (row * 137.508) % 360; // Golden angle
      return `hsl(${hue}, 70%, 40%)`;
    }
    
    // Calculate note using simpler frequency mapping
    function getHarmonicNote(row, prime) {
      // Use pentatonic scale (always sounds good)
      const pentatonic = [0, 2, 4, 7, 9]; // Major pentatonic intervals
      const baseNote = 36; // C2 - low bass
      const octave = Math.floor(row / 5) * 12;
      const scale = pentatonic[row % 5];
      return baseNote + octave + scale + (prime - 3) * 2;
    }
    
    // Sierpinski triangle fractal
    function drawSierpinski(x, y, size, depth, prime) {
      if (depth === 0) {
        const offset = Math.sin(fractalSeed * 1000 + x + y) * 20;
        const hue = ((prime * 40) + offset) % 360;
        fractalCtx.fillStyle = `hsla(${hue}, 70%, 50%, ${0.1 + Math.abs(Math.sin(fractalSeed * depth)) * 0.1})`;
        fractalCtx.beginPath();
        fractalCtx.moveTo(x, y);
        fractalCtx.lineTo(x + size, y);
        fractalCtx.lineTo(x + size/2, y - size * 0.866);
        fractalCtx.closePath();
        fractalCtx.fill();
        return;
      }
      
      const halfSize = size / 2;
      const height = size * 0.866 / 2;
      const jitter = Math.sin(fractalSeed * depth * 100) * 5;
      
      drawSierpinski(x + jitter, y, halfSize, depth - 1, prime);
      drawSierpinski(x + halfSize - jitter, y, halfSize, depth - 1, prime);
      drawSierpinski(x + halfSize/2, y - height + jitter, halfSize, depth - 1, prime);
      
      if (prime >= 5 && depth > 2) {
        drawSierpinski(x + halfSize/4, y - height/2, halfSize/2, depth - 2, prime);
      }
    }
    
    // Draw fractal background
    function drawFractal() {
      fractalCtx.fillStyle = '#000';
      fractalCtx.fillRect(0, 0, 480, 480);
      drawSierpinski(40, 440, 400, fractalDepth, currentPrime);
    }
    
    
    // Update all notes when prime changes
    function updatePrimeHarmonics(prime) {
      currentPrime = prime;
      buttons.forEach(btn => {
        btn.note = getHarmonicNote(btn.row, prime);
        btn.color = getPrimeColor(btn.row);
      });
      document.getElementById('modeInfo').textContent = 
        `HARMONIC MODE: ${PRIME_NAMES[PRIMES.indexOf(prime)]}`;
      drawFractal();
      render();
    }
    
    // Euclidean rhythm generator
    function euclideanRhythm(steps, pulses) {
      if (pulses >= steps || pulses === 0) {
        return Array(steps).fill(pulses > 0);
      }
      
      let pattern = Array(steps).fill(false);
      let bucket = 0;
      
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) {
          bucket -= steps;
          pattern[i] = true;
        }
      }
      return pattern;
    }
    
    function generateEuclideanPattern() {
      const prime = currentPrime;
      buttons.forEach(btn => {
        const pattern = euclideanRhythm(8, prime % 8 || 1);
        btn.active = pattern[btn.col];
      });
      render();
    }

    function rotatePattern(pattern, offset) {
      const out = Array(pattern.length);
      for (let i = 0; i < pattern.length; i++) {
        out[(i + offset) % pattern.length] = pattern[i];
      }
      return out;
    }

    function generateEuclideanPatternWithSeed() {
      const prime = currentPrime;
      const seedBits = Math.floor(fractalSeed * 4096);
      
      buttons.forEach(btn => {
        const pulses = ((prime + btn.row + ((seedBits >> btn.row) & 3)) % 8) || 1;
        const base = euclideanRhythm(8, pulses);
        const rot = (seedBits + btn.row * 3) % 8;
        const pattern = rotatePattern(base, rot);
        btn.active = pattern[btn.col];
      });
      
      render();
    }

    // Fractal rhythm generator (Sierpinski-like across grid)
    function generateFractalPattern() {
      const primeOffset = PRIMES.indexOf(currentPrime) + 1;
      const seedBits = Math.floor(fractalSeed * 4096);
      const densityGate = (seedBits >> 6) % 5; // 0..4
      
      buttons.forEach(btn => {
        const r = (btn.row + primeOffset) % 8;
        const c = (btn.col + (seedBits >> btn.row)) % 8;
        const sierp = ((r & c) === 0);
        const gate = ((r + c + primeOffset) % 5) >= densityGate;
        btn.active = sierp && gate;
      });
      
      render();
    }
    
    let isPlaying = false;
    let currentStep = 0;
    let bpm = 120;
    let intervalId = null;
    
    function playNote(note) {
      if (!audioCtx) {
        console.log('Audio context not ready');
        return;
      }
      
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        // MIDI note to frequency
        const freq = 440 * Math.pow(2, (note - 69) / 12);
        osc.frequency.value = freq;
        osc.type = 'sawtooth';
        
        filter.type = 'lowpass';
        filter.frequency.value = freq * 4;
        filter.Q.value = 2;
        
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {
        console.error('Audio error:', e);
      }
    }
    
    // Render grid
    function render() {
      ctx.clearRect(0, 0, 480, 480);
      // Let the fractal canvas show through a bit
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, 480, 480);
      
      for (let i = 0; i < 64; i++) {
        const col = i % 8;
        const row = Math.floor(i / 8);
        const x = col * 60;
        const y = row * 60;
        
        const isCurrentStep = isPlaying && col === currentStep;
        
        if (isCurrentStep) {
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(x, y, 58, 58);
        }
        
        ctx.fillStyle = buttons[i].active ? buttons[i].color : '#0a0a0a';
        ctx.fillRect(x + 4, y + 4, 50, 50);
        
        if (buttons[i].active) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = buttons[i].color;
          ctx.fillStyle = buttons[i].color;
          ctx.fillRect(x + 4, y + 4, 50, 50);
          ctx.shadowBlur = 0;
        }
        
        ctx.strokeStyle = buttons[i].active ? '#fff' : (isCurrentStep ? '#333' : '#222');
        ctx.lineWidth = buttons[i].active ? 2 : 1;
        ctx.strokeRect(x + 4, y + 4, 50, 50);
      }
    }
    
    // Sequencer step
    function step() {
      for (let row = 0; row < 8; row++) {
        const i = row * 8 + currentStep;
        if (buttons[i].active) playNote(buttons[i].note);
      }
      
      currentStep = (currentStep + 1) % 8;
      render();
    }
    
    // Play/Stop
    document.getElementById('playBtn').onclick = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log('Audio context created on play');
      }
      
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      
      if (isPlaying) {
        btn.textContent = 'STOP';
        btn.classList.add('playing');
        currentStep = 0;
        const interval = (60 / bpm) * 1000 / 2;
        intervalId = setInterval(step, interval);
      } else {
        btn.textContent = 'PLAY';
        btn.classList.remove('playing');
        clearInterval(intervalId);
        currentStep = 0;
        render();
      }
    };
    
    // BPM control
    document.getElementById('bpmSlider').oninput = (e) => {
      bpm = parseInt(e.target.value);
      document.getElementById('bpmValue').textContent = bpm;
      
      if (isPlaying) {
        clearInterval(intervalId);
        const interval = (60 / bpm) * 1000 / 2;
        intervalId = setInterval(step, interval);
      }
    };
    
    // Prime selector
    document.getElementById('primeSlider').oninput = (e) => {
      const idx = parseInt(e.target.value);
      const prime = PRIMES[idx];
      document.getElementById('primeValue').textContent = prime;
      updatePrimeHarmonics(prime);
    };
    
    // Fractal depth
    document.getElementById('depthSlider').oninput = (e) => {
      fractalDepth = parseInt(e.target.value);
      document.getElementById('depthValue').textContent = fractalDepth;
      drawFractal();
    };
    
    // Click handler
    canvas.onclick = (e) => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const i = Math.floor(y / 60) * 8 + Math.floor(x / 60);
      
      if (i >= 0 && i < 64) {
        buttons[i].active = !buttons[i].active;
        
        if (buttons[i].active && !isPlaying) {
          playNote(buttons[i].note);
        }
        
        render();
      }
    };
    
    // Clear
    document.getElementById('clearBtn').onclick = () => {
      buttons.forEach(btn => btn.active = false);
      render();
    };
    
    // Random
    document.getElementById('randomBtn').onclick = () => {
      buttons.forEach(btn => {
        btn.active = Math.random() > 0.7;
      });
      render();
    };
    
    // Euclidean
    document.getElementById('euclidBtn').onclick = () => {
      generateEuclideanPatternWithSeed();
    };
    
    // Regenerate fractal
    document.getElementById('fractalBtn').onclick = () => {
      fractalSeed = Math.random();
      drawFractal();
      generateFractalPattern();
      generateEuclideanPatternWithSeed();
    };
    
    // Initial render
    drawFractal();
    render();
  </script>
</body>
</html>
