<!DOCTYPE html>
<html>
<head>
  <title>Prime Harmonic Fractal Sequencer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0a; 
      color: #fff; 
      font-family: 'Courier New', monospace; 
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    canvas { border: 2px solid #333; cursor: pointer; }
    #controls { 
      display: flex; 
      gap: 15px; 
      align-items: center;
      flex-wrap: wrap;
      background: #111;
      padding: 15px;
      border-radius: 8px;
    }
    button {
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-width: 120px;
      transition: all 0.2s;
    }
    button:hover { background: #333; box-shadow: 0 0 10px #0f0; }
    button.active { background: #0a0; color: #000; }
    button.playing { 
      background: #00f; 
      color: #fff;
      animation: pulse 0.5s infinite; 
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 5px #00f; }
      50% { box-shadow: 0 0 20px #00f; }
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input[type="range"] {
      width: 150px;
    }
    label {
      font-size: 11px;
      color: #0f0;
      text-transform: uppercase;
    }
    h2 {
      color: #0f0;
      text-shadow: 0 0 10px #0f0;
      letter-spacing: 2px;
    }
    .info {
      color: #666;
      font-size: 11px;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }
    .mode-info {
      background: #111;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      color: #0f0;
      border: 1px solid #0f0;
    }
  </style>
</head>
<body>
  <h2>⬢ PRIME HARMONIC FRACTAL SEQUENCER ⬢</h2>
  
  <div id="controls">
    <button id="audioBtn">ENABLE AUDIO</button>
    <button id="playBtn">PLAY</button>
    <button id="clearBtn">CLEAR</button>
    <button id="randomBtn">RANDOM</button>
    <button id="euclidBtn">EUCLIDEAN</button>
    
    <div class="slider-group">
      <label>BPM: <span id="bpmValue">120</span></label>
      <input type="range" id="bpmSlider" min="60" max="240" value="120">
    </div>
    
    <div class="slider-group">
      <label>Prime: <span id="primeValue">3</span></label>
      <input type="range" id="primeSlider" min="0" max="7" value="1" step="1">
    </div>
  </div>
  
  <div class="mode-info" id="modeInfo">
    HARMONIC MODE: Perfect Fifth (3:2 ratio)
  </div>
  
  <canvas id="grid" width="480" height="480"></canvas>
  
  <div class="info">
    Click to toggle notes • Colors = prime harmonics • Rows = overtone series • Columns = time steps<br>
    Euclidean mode generates fractal rhythms using prime number divisions
  </div>
  
  <script type="module">
    // Prime numbers for harmonic ratios
    const PRIMES = [2, 3, 5, 7, 11, 13, 17, 19];
    const PRIME_NAMES = [
      'Octave (2:1)',
      'Perfect Fifth (3:2)', 
      'Major Third (5:4)',
      'Harmonic Seventh (7:4)',
      'Eleventh (11:8)',
      'Tridecimal (13:8)',
      'Seventeenth (17:16)',
      'Nineteenth (19:16)'
    ];
    
    // State
    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    let currentPrime = 3;
    let buttons = initButtons();
    
    function initButtons() {
      return Array(64).fill().map((_, i) => {
        const row = Math.floor(i / 8);
        const col = i % 8;
        return {
          active: false,
          color: getPrimeColor(row),
          note: getHarmonicNote(row, currentPrime),
          row, col
        };
      });
    }
    
    // Color based on prime factorization
    function getPrimeColor(row) {
      const hue = (row * 137.508) % 360; // Golden angle
      return `hsl(${hue}, 70%, 30%)`;
    }
    
    // Calculate note using just intonation based on prime ratios
    function getHarmonicNote(row, prime) {
      const baseNote = 48; // C3
      const ratio = prime / 2; // Just intonation ratio
      const octave = Math.floor(row / prime);
      return baseNote + (row % prime) * (Math.log2(ratio) * 12) + (octave * 12);
    }
    
    // Update all notes when prime changes
    function updatePrimeHarmonics(prime) {
      currentPrime = prime;
      buttons.forEach(btn => {
        btn.note = getHarmonicNote(btn.row, prime);
        btn.color = getPrimeColor(btn.row);
      });
      document.getElementById('modeInfo').textContent = 
        `HARMONIC MODE: ${PRIME_NAMES[PRIMES.indexOf(prime)]}`;
      render();
    }
    
    // Euclidean rhythm generator (Bjorklund algorithm)
    function euclideanRhythm(steps, pulses) {
      if (pulses >= steps || pulses === 0) {
        return Array(steps).fill(pulses > 0);
      }
      
      let pattern = Array(steps).fill(false);
      let bucket = 0;
      
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) {
          bucket -= steps;
          pattern[i] = true;
        }
      }
      return pattern;
    }
    
    // Generate fractal pattern using prime
    function generateEuclideanPattern() {
      const prime = currentPrime;
      buttons.forEach(btn => {
        const pattern = euclideanRhythm(8, prime % 8 || 1);
        btn.active = pattern[btn.col];
        btn.color = btn.active ? getPrimeColor(btn.row) : '#1a1a1a';
      });
      render();
    }
    
    let isPlaying = false;
    let currentStep = 0;
    let bpm = 120;
    let intervalId = null;
    
    // Web Audio
    let audioCtx = null;
    
    document.getElementById('audioBtn').onclick = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('audioBtn').textContent = 'AUDIO ENABLED';
        document.getElementById('audioBtn').classList.add('active');
      }
    };
    
    function playNote(note) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      
      // MIDI note to frequency
      const freq = 440 * Math.pow(2, (note - 69) / 12);
      osc.frequency.value = freq;
      osc.type = 'sawtooth'; // Richer harmonics
      
      // Low-pass filter for warmth
      filter.type = 'lowpass';
      filter.frequency.value = freq * 4;
      filter.Q.value = 2;
      
      // Envelope
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }
    
    // Render grid
    function render() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 480, 480);
      
      for (let i = 0; i < 64; i++) {
        const col = i % 8;
        const row = Math.floor(i / 8);
        const x = col * 60;
        const y = row * 60;
        
        // Highlight current step
        const isCurrentStep = isPlaying && col === currentStep;
        
        if (isCurrentStep) {
          ctx.fillStyle = '#1a1a1a';
          ctx.fillRect(x, y, 58, 58);
        }
        
        // Button
        ctx.fillStyle = buttons[i].active ? buttons[i].color : '#0a0a0a';
        ctx.fillRect(x + 4, y + 4, 50, 50);
        
        // Glow effect for active buttons
        if (buttons[i].active) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = buttons[i].color;
          ctx.fillStyle = buttons[i].color;
          ctx.fillRect(x + 4, y + 4, 50, 50);
          ctx.shadowBlur = 0;
        }
        
        // Border
        ctx.strokeStyle = buttons[i].active ? '#fff' : (isCurrentStep ? '#333' : '#222');
        ctx.lineWidth = buttons[i].active ? 2 : 1;
        ctx.strokeRect(x + 4, y + 4, 50, 50);
      }
    }
    
    // Sequencer step
    function step() {
      for (let row = 0; row < 8; row++) {
        const i = row * 8 + currentStep;
        if (buttons[i].active) {
          playNote(buttons[i].note);
        }
      }
      
      currentStep = (currentStep + 1) % 8;
      render();
    }
    
    // Play/Stop
    document.getElementById('playBtn').onclick = () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      
      if (isPlaying) {
        btn.textContent = 'STOP';
        btn.classList.add('playing');
        currentStep = 0;
        const interval = (60 / bpm) * 1000 / 2;
        intervalId = setInterval(step, interval);
      } else {
        btn.textContent = 'PLAY';
        btn.classList.remove('playing');
        clearInterval(intervalId);
        currentStep = 0;
        render();
      }
    };
    
    // BPM control
    document.getElementById('bpmSlider').oninput = (e) => {
      bpm = parseInt(e.target.value);
      document.getElementById('bpmValue').textContent = bpm;
      
      if (isPlaying) {
        clearInterval(intervalId);
        const interval = (60 / bpm) * 1000 / 2;
        intervalId = setInterval(step, interval);
      }
    };
    
    // Prime selector
    document.getElementById('primeSlider').oninput = (e) => {
      const idx = parseInt(e.target.value);
      const prime = PRIMES[idx];
      document.getElementById('primeValue').textContent = prime;
      updatePrimeHarmonics(prime);
    };
    
    // Click handler
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const i = Math.floor(y / 60) * 8 + Math.floor(x / 60);
      
      if (i >= 0 && i < 64) {
        buttons[i].active = !buttons[i].active;
        
        if (buttons[i].active && !isPlaying) {
          playNote(buttons[i].note);
        }
        
        render();
      }
    };
    
    // Clear
    document.getElementById('clearBtn').onclick = () => {
      buttons.forEach(btn => btn.active = false);
      render();
    };
    
    // Random
    document.getElementById('randomBtn').onclick = () => {
      buttons.forEach(btn => {
        btn.active = Math.random() > 0.7;
      });
      render();
    };
    
    // Euclidean
    document.getElementById('euclidBtn').onclick = () => {
      generateEuclideanPattern();
    };
    
    // Initial render
    render();
  </script>
</body>
</html>
